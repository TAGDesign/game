<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Клёв и котелок</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="fish" viewBox="0 0 40 24">
    <path fill="currentColor" d="M2 12C8 3 21 2 29 12 21 22 8 21 2 12Z"/>
    <path fill="currentColor" d="M27 12 38 4 35.500 12 38 20Z"/>
    <path fill="currentColor" d="M13 5.500 19 1 22 6.200Z"/>
    <circle cx="8.500" cy="10.500" r="1.400" fill="var(--surface)"/>
  </symbol>
</svg>

<div class="app">
  <header class="hud">
    <div class="skill" id="fishBox">
      <div class="skill-row"><span class="label">Рыболовство</span><span class="skill-num"><b id="fishNum">1</b><i id="fishBuff"></i></span></div>
      <div class="bar"><i id="fishBar"></i></div>
    </div>
    <div class="skill" id="cookBox">
      <div class="skill-row"><span class="label">Кулинария</span><span class="skill-num"><b id="cookNum">1</b></span></div>
      <div class="bar"><i id="cookBar"></i></div>
    </div>
    <div class="gold" title="Золото"><span class="coin"></span><b id="goldNum">0</b></div>
  </header>
  <div class="goal" id="goal"></div>

  <main>
    <section class="panel" id="tab-home">
      <div id="reportBox"></div>
      <div class="list" id="homeList"></div>
      <h2>Прототип</h2>
      <div class="settings" id="settings"></div>
    </section>

    <section class="panel" id="tab-fish" hidden>
      <div class="waters" id="waters"></div>
      <button class="water" id="water" data-state="idle" aria-describedby="callout">
        <span class="wtop"><span>Забросы <b id="energyNum">20</b> / <span id="energyMax">20</span></span><span id="energyTimer"></span></span>
        <span class="wnote" id="wnote"></span>
        <span class="rings"></span>
        <span class="bobber"></span>
        <span class="catch" id="catchCard" hidden></span>
        <span class="callout" id="callout" aria-live="assertive">Нажми на воду, чтобы забросить</span>
        <span class="castbar"><i id="castFill"></i></span>
      </button>
      <div class="bag" id="bag"></div>
      <div class="food" id="food"></div>
    </section>

    <section class="panel" id="tab-cook" hidden>
      <div class="list" id="cookList"></div>
    </section>

    <section class="panel" id="tab-map" hidden>
      <div class="map" id="mapGrid"></div>
      <div id="mapDetail"></div>
    </section>

    <section class="panel" id="tab-market" hidden>
      <div class="event" id="merchantBox"></div>
      <h2>Продать рыбу</h2>
      <div class="list" id="fishSell"></div>
      <h2>Продать блюда</h2>
      <div class="list" id="dishSell"></div>
      <h2>Рецепты</h2>
      <div class="list" id="recipeList"></div>
      <h2>Снасти</h2>
      <div class="list" id="gearList"></div>
    </section>
  </main>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tabbtn-home" data-tab="home" aria-selected="true">Дом</button>
    <button role="tab" id="tabbtn-fish" data-tab="fish" aria-selected="false">Рыбалка</button>
    <button role="tab" id="tabbtn-cook" data-tab="cook" aria-selected="false">Кухня</button>
    <button role="tab" id="tabbtn-map" data-tab="map" aria-selected="false">Карта</button>
    <button role="tab" id="tabbtn-market" data-tab="market" aria-selected="false">Торговец</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="logic.js"></script>
<script src="ui.js"></script>
</body>
</html>
